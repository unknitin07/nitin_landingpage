<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetArena - Premium Betting Insights</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(180deg, #1a1a1a 0%, #000000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
            overflow: hidden;
            position: relative;
        }

        .logo::after {
            content: 'LOGO';
            font-size: 16px;
            font-weight: bold;
            color: #000;
            font-family: Arial, sans-serif;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.3); }
            50% { box-shadow: 0 0 60px rgba(255, 215, 0, 0.5); }
        }

        h1 {
            font-size: 48px;
            font-weight: 700;
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .subtext {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 40px;
            font-style: italic;
        }

        .join-button {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            font-size: 22px;
            font-weight: bold;
            padding: 18px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .join-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.8), 0 12px 35px rgba(255, 215, 0, 0.5);
        }

        .content {
            margin-bottom: 50px;
        }

        .content p {
            font-size: 20px;
            color: #e0e0e0;
            margin-bottom: 35px;
            line-height: 1.6;
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            margin-bottom: 60px;
        }

        .feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid #FFD700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            position: relative;
        }

        .feature-icon::after {
            content: 'ICON';
            font-size: 10px;
            font-weight: bold;
            color: #FFD700;
            font-family: Arial, sans-serif;
        }

        .feature-icon img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .feature-text {
            font-size: 14px;
            color: #cccccc;
            font-family: 'Arial', sans-serif;
        }

        .contact-button {
            background: rgba(255, 215, 0, 0.1);
            color: #FFD700;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 40px;
            border: 2px solid #FFD700;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
        }

        .contact-button:hover {
            background: rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.6);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 36px;
            }
            
            .join-button {
                font-size: 18px;
                padding: 15px 40px;
            }
            
            .features {
                gap: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Replace with: <div class="logo"><img src="your-logo.png" alt="BetArena Logo"></div> -->
        <div class="logo"></div>
        
        <h1>BetArena</h1>
        
        <p class="subtext">Daily Premium Betting Insights & Winning Strategies</p>
        
        <button class="join-button" onclick="window.open('https://t.me/yourusername', '_blank')">
            Join Telegram Channel
        </button>
        
        <div class="content">
            <p>Join 50,000+ members who win smartly, not blindly.</p>
            
            <div class="features">
                <div class="feature">
                    <!-- Replace with: <div class="feature-icon"><img src="lightning-icon.png" alt="Instant"></div> -->
                    <div class="feature-icon"></div>
                    <div class="feature-text">Instant Updates</div>
                </div>
                <div class="feature">
                    <!-- Replace with: <div class="feature-icon"><img src="money-icon.png" alt="Verified"></div> -->
                    <div class="feature-icon"></div>
                    <div class="feature-text">Verified Odds</div>
                </div>
                <div class="feature">
                    <!-- Replace with: <div class="feature-icon"><img src="target-icon.png" alt="Expert"></div> -->
                    <div class="feature-icon"></div>
                    <div class="feature-text">Expert Picks</div>
                </div>
            </div>
        </div>
        
        <button class="contact-button" onclick="window.open('https://t.me/youradminusername', '_blank')">
            Contact for Ads Setup
        </button>
    </div>
</body>
</html>
